version: 2
seeds:
  - name: orders
    config:
      column_types:
        order_id: integer
        customer_id: integer
        product_id: integer
        quantity: integer
        status: varchar(20)
  - name: customers
    config:
      column_types:
        customer_id: integer
        customer_name: varchar(80)
  - name: products
    config:
      column_types:
        product_id: integer
        product_name: varchar(80)
        unit_price: number(10,2)
